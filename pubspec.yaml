name: stonewatch
description: Stonewatch — stack the tower, cash out before it falls.
publish_to: "none"
version: 1.0.1+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # ── Native game core (Rust via FFI, bundled by hook/build.dart) ──
  code_assets: ^1.2.1
  hooks: ^2.0.2

  # ── White game ──
  shared_preferences: ^2.5.3

  # ── Gateway stack ──
  # Versions pinned at or above the attribution-stack floors in
  # .cursor/rules/gray_part_pitfalls.md §19; pin strings deliberately
  # differ from sibling builds.
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.13.0
  connectivity_plus: ^7.0.0
  appsflyer_sdk: ^6.18.0
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.0
  firebase_app_check: ^0.4.5
  flutter_local_notifications: ^22.0.0
  flutter_secure_storage: ^10.3.0
  device_info_plus: ^11.4.0
  http: ^1.5.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Adaptive launcher icon generated from the branding art. The foreground is
# inset to the 72dp safe zone (108dp canvas, 17% inset) and sits on the sky
# background colour. Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  min_sdk_android: 26
  image_path: "assets/branding/icon2_Stonewatch.png"
  adaptive_icon_background: "#20A9FA"
  adaptive_icon_foreground: "assets/branding/icon2_Stonewatch.png"
  adaptive_icon_foreground_inset: 17

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/loading/
    - assets/gameplay/
    - assets/ui/
  fonts:
    - family: Lilita
      fonts:
        - asset: assets/fonts/LilitaOne-Regular.ttf
