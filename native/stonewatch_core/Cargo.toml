[package]
name = "stonewatch_core"
version = "1.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pure-Rust AEAD for the secret vault. `default-features = false` drops the
# runtime RNG (the shipped library only ever DECRYPTS); `alloc` gives the
# Vec-returning encrypt/decrypt. Cross-compiles cleanly to every Android ABI.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }

[dev-dependencies]
# Host-only entropy for the offline sealer examples (fresh nonce per value).
getrandom = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
